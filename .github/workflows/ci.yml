name: CI

# The seven quality gates in package.json existed before this workflow did, and nothing ran
# them. Every defect the 2026-07 audit found was reachable by running a command the repo
# already provided — 18 failing tests, a type error inside a published package, a broken
# docs build, a README that did not compile. This is the thing that makes the rest stay
# fixed, so it blocks merges.

on:
  push:
    branches: [main]
  pull_request:
  # Lets a maintainer re-run the gates against a branch without pushing.
  workflow_dispatch:

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Flow snapshot signing and session encryption both refuse to run without a key.
  # Deterministic and public on purpose — it protects nothing real.
  APP_KEY: ci-app-key-aaaaaaaaaaaaaaaaaaaaaaaaaaaa
  APP_ENV: test

jobs:
  # Static gates: fast, no services, and the ones most likely to catch a mistake.
  static:
    name: Types, lint & API surface
    runs-on: ubuntu-latest
    steps:
      # Full history, because `breaking:check` compares this change against the
      # branch it forked from. The default shallow clone has no such commit, and a
      # gate that cannot find its base is a gate that passes for the wrong reason.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # `typecheck` excludes *.test.ts, so test files would otherwise get no type
      # coverage at all — a test can assert against a shape the API never returns
      # and still pass. Baselined per package: the existing failures are
      # grandfathered, new ones fail.
      #
      # **The recorded 252 is real, and it is not a backlog.** Audited: most of it
      # is tests asserting a literal against a generically-typed return —
      # `expect(config.get("app.debug")).toBe(false)`, where `get()` gives back
      # `unknown`. That is signal about the *API's* types, not a broken test: an
      # app developer writing the same line has to cast too. A second class is
      # control flow — a variable assigned inside a callback and asserted after,
      # which TypeScript cannot follow through the closure.
      #
      # Both are mechanical to fix and there are ~250 of them, so this is a
      # dedicated pass rather than something to do a little of. Until that pass
      # happens the number stands, and the ratchet is what earns its keep: a *new*
      # error fails naming its package and delta, unobscured by the grandfathered
      # ones. Verified by planting one — `cache 6 > 5`, exit 1.
      - name: Typecheck tests
        if: ${{ !cancelled() }}
        run: bun run typecheck:tests

      - name: Lint
        if: ${{ !cancelled() }}
        run: bun run lint:ci

      # Package-convention checks (provider location, config factory shape, error base
      # class). Zero tolerance: every package passes clean, and a new violation fails CI.
      # `!cancelled()` on every check below, so one failure reports its own result
      # instead of skipping the rest of the job. When the `@zerotal/ai` maturity
      # review fell due, this step failed and took eleven later gates with it — they
      # were reported as skipped, and two releases shipped without them ever running.
      # A gate nobody reads is the same as no gate; so is a gate that is never reached.
      - name: Package conventions
        if: ${{ !cancelled() }}
        run: bun run lint:packages:ci

      # `endOfLine: "auto"` in .prettierrc.json is what makes this gate meaningful on a
      # checkout with `core.autocrlf=true`: without it every file arrives CRLF and fails,
      # burying the handful of real formatting issues under the whole tree.
      - name: Formatting
        if: ${{ !cancelled() }}
        run: bun run format:check

      # Both of these keep a baseline file in the repo; they fail when the tree drifts from
      # it, and the fix is to look at what changed rather than to move the baseline.
      - name: Cast ratchet
        if: ${{ !cancelled() }}
        run: bun run cast:check

      - name: API surface
        if: ${{ !cancelled() }}
        run: bun run api:surface:check

      # `api-surface.md` records the typed exports, and for the whole MCP tool system
      # that is one line: `archTools = (ctx) => ArchTool[]`. Rename `search_docs`, drop a
      # field from what `routes` returns, or make an argument required, and that line is
      # byte-identical — the gate above passes and every configured agent client breaks.
      # The names are runtime data, so nothing type-level can see them. This diffs the
      # contract itself.
      - name: MCP tool surface
        if: ${{ !cancelled() }}
        run: bun run mcp:surface:check

      # `api:surface:check` refuses to let an export change shape without somebody
      # regenerating the snapshot — and regenerating is the whole of what it asks.
      # Once the snapshot is updated the removal is recorded and no longer
      # reported, so the changelog, which is the only thing a user reads before
      # upgrading, was defended by remembering. It failed exactly that way:
      # `this.title(…)` left @zerotal/flow in a commit subjected `flow!:` and
      # shipped in 1.7.3 with no BREAKING entry in either changelog. This reads
      # the diff of the snapshots, which is where a removal is still visible.
      - name: Breaking changes are announced
        if: ${{ !cancelled() }}
        run: bun run breaking:check

      # Documentation drifts silently: a signature changes, the guide keeps the old
      # call, and nothing complains until a reader copies it. This compiles every
      # TypeScript block in docs/ against the real workspace types.
      #
      # Two keyed lists rather than a count, because a count lets one fragment be
      # deleted and another introduced while the number holds. `fragments` are
      # blocks deliberately written as a class body or a method without its class,
      # marked `fragment` in their fence and never inferred. `drift` is the other
      # kind — blocks that resolve everything and still fail, which is broken
      # documentation and is recorded under that name so it reads as work
      # outstanding rather than as intent. Neither list may grow.
      - name: Documentation examples
        if: ${{ !cancelled() }}
        run: bun run docs:examples:check

      # `docs/` lives at the repo root and ships in no package, so the agent
      # surface vendors a copy — that copy is what `search_docs` answers from in
      # an installed app. Unverified, it would drift and start describing an API
      # the app is not running, which is worse than having no search at all.
      - name: Vendored docs corpus
        if: ${{ !cancelled() }}
        run: bun run arch:docs:check

      # `<Icon name>` is a union generated from the vendored icon bodies, so the two
      # drift apart the moment one is edited without the other — and the symptom is a
      # compile error in somebody else's app. Offline on purpose: it compares the two
      # files, never npm, so an upstream release does not redden a build that changed
      # nothing. Upgrading the set is `bun run icons:sync`, reviewed as a diff.
      - name: Icon names
        if: ${{ !cancelled() }}
        run: bun run icons:check

      # The component reference is generated from the flow-ui registry + doc specs.
      # Without this gate a new component ships undocumented and nothing complains,
      # which is how the page came to cover 20 of 53.
      - name: Component docs
        if: ${{ !cancelled() }}
        run: bun run docs:components:check

      # A `stable` maturity is a promise about every export, and a promise over a
      # surface nobody wrote down is not one anyone can use. Baseline-and-ratchet
      # rather than a wall: today's gap is recorded, a regression fails, and the
      # number only moves down. A gate demanding a clean sweep on the day it lands
      # either blocks the release or gets switched off.
      - name: Docs coverage
        if: ${{ !cancelled() }}
        run: bun run docs:coverage

      # types/routes.generated.ts is what makes `route()` type-checked, and it is
      # only correct if it is regenerated when routes change. `zt dev` refreshes it,
      # but a route added in an editor-only session (or by a provider) would ship
      # stale otherwise — and a generated file that is wrong is worse than none.
      - name: Route types
        if: ${{ !cancelled() }}
        run: cd apps/docs && bun zt.ts route:types --check

  test:
    name: Tests (Bun ${{ matrix.bun }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is what `engines.bun` promises, so it stays tested; latest
        # catches a Bun regression within days of its release instead of when
        # users hit it. Raising the floor means moving the pin here AND in every
        # package's `engines` — deliberately, in a release-noted change.
        bun: ["1.3.14", "latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}

      - name: Install
        run: bun install --frozen-lockfile

      # FlowBrowser drives a headless Chrome. The runner image ships one, but Bun's
      # auto-detection is what actually has to find it, so the path is pinned here
      # and the step fails loudly when there is none — a browser suite that skips
      # itself in CI reports green for exactly the failures it exists to catch.
      - name: Locate a browser for FlowBrowser
        run: |
          for candidate in "$CHROME_BIN" /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/chromium-browser /usr/bin/chromium; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              echo "BUN_CHROME_PATH=$candidate" >> "$GITHUB_ENV"
              echo "using $candidate"
              exit 0
            fi
          done
          echo "::error::No Chrome/Chromium on the runner — FlowBrowser's suite would skip."
          exit 1

      # The docs app's stylesheet and bundle are build artifacts, and gitignored —
      # so a checkout has neither. `mobile-layout.test.ts` drives a real browser
      # over real pages, and without the stylesheet every code block loses its
      # `overflow-x: auto` and the page scrolls sideways: the suite reported 204px
      # of overflow on a site that has none, because it was measuring an unstyled
      # one. Anything asserting about layout has to be given the layout.
      - name: Build docs assets
        working-directory: apps/docs
        run: bun run build

      - name: Test
        run: bun run test

  # The ORM's real query execution is all against SQLite :memory:, while deployment docs
  # point DATABASE_URL at PostgreSQL. Dialect coverage is substring-matching on the SQL a
  # Blueprint emits, and a string is not a schema — which is what this job is for.
  #
  # For its first two weeks it closed none of that. It ran `bun test src/`, whose every
  # connection is `new SQL(":memory:")` — so it stood a Postgres 16 container up beside a
  # suite that never dialled it, and reported success 55 runs running. `continue-on-error`
  # was not what stood between this repo and a Postgres gate; nothing was being tested.
  #
  # `server.smoke.test.ts` is the part that connects, `ZT_PG_URL` selects the server, and
  # the reachability step below exists because that suite skips itself without one. Its first
  # real run failed seven of nine on a single defect — `table.boolean()` emitting INTEGER,
  # which PostgreSQL will not take a boolean into. That is now fixed and the job blocks
  # merges, so the next such defect fails a pull request instead of shipping.
  postgres:
    name: ORM against PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zerotal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/zerotal_test
      ZT_PG_URL: postgres://postgres:postgres@localhost:5432/zerotal_test
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      # The smoke suite skips itself when ZT_PG_URL is unset or points at nothing, which in CI
      # would report green for precisely the SQL this job exists to execute. Proving the round
      # trip here — same URL the tests read — makes that skip impossible rather than unlikely.
      # Same reasoning as the browser step above.
      - name: Verify PostgreSQL is reachable
        run: |
          bun -e '
            const { SQL } = require("bun");
            const url = process.env.ZT_PG_URL;
            if (!url) { console.error("::error::ZT_PG_URL is unset — the Postgres suite would skip."); process.exit(1); }
            const db = new SQL(url);
            const rows = await db`SELECT version()`;
            console.log(rows[0].version);
            await db.end();
          '

      # `src/` is the whole ORM suite: the SQLite bulk of it, plus server.smoke.test.ts,
      # which reads ZT_PG_URL from the job env and is the only part that leaves the process.
      - name: ORM tests
        working-directory: packages/orm
        run: bun test src/

  # MySQL was documented as "experimental — no CI suite runs against a real MySQL server
  # yet", and that was true for the same reason Postgres's job was hollow: nothing dialled
  # out. `server.smoke.test.ts` is dialect-parameterised, so the same fifteen cases run here
  # under `ZT_MYSQL_URL` — identity columns, type round-trips, constraint violations,
  # `LOCK IN SHARE MODE` (where Postgres emits `FOR SHARE`), rollback and `ALTER`.
  #
  # It blocks, on the same evidence Postgres's job produced: its first honest run failed on
  # `table.string()` compiling to TEXT, which MySQL will not key without a prefix length —
  # so `string("email").unique()` could not be created at all. Fixed, green after, gate on.
  mysql:
    name: ORM against MySQL
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: zerotal_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ZT_MYSQL_URL: mysql://root:root@127.0.0.1:3306/zerotal_test
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      # Same reason as the Postgres step: the suite skips itself without a reachable
      # server, and a skip in CI reports green for exactly what this job exists to run.
      - name: Verify MySQL is reachable
        run: |
          bun -e '
            const { SQL } = require("bun");
            const url = process.env.ZT_MYSQL_URL;
            if (!url) { console.error("::error::ZT_MYSQL_URL is unset — the MySQL suite would skip."); process.exit(1); }
            const db = new SQL(url);
            const rows = await db`SELECT VERSION() AS v`;
            console.log(rows[0].v);
            await db.end();
          '

      - name: ORM tests
        working-directory: packages/orm
        run: bun test src/
