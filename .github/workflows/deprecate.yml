name: Deprecate

# Marks published versions as deprecated on npm, across every public package in
# the workspace. Deprecation is a warning printed at install time — the versions
# stay installable for anyone who pinned them; nothing is unpublished.
#
# Manual-only (workflow_dispatch): deprecating is a statement to users, so a
# human picks the range and the wording. Runs here rather than from a laptop
# because CI holds the npm Automation token; nobody needs publish credentials
# on their machine to steer people off a bad version.
#
# This is the one npm write that still needs the `NPM_TOKEN` secret. Trusted
# publishing covers publishing (release.yml) and nothing else: npm makes no OIDC
# exchange for `npm deprecate`. Without the secret this workflow stops before
# touching anything, and a deprecation runs from a maintainer's machine instead
# (docs/contributing.md, under "Publishing").

on:
  workflow_dispatch:
    inputs:
      range:
        description: "Version or range to deprecate, e.g. <=1.0.2"
        required: true
        default: "<=1.0.2"
      message:
        description: "Deprecation message shown at install time"
        required: true
        default: "Early releases with packaging defects — install ^1.0.4 instead."

permissions:
  contents: read

jobs:
  deprecate:
    name: Deprecate ${{ inputs.range }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # The same npm major release.yml publishes with, so both workflows talk to
      # the registry through one client.
      - name: Upgrade npm
        run: |
          npm install -g npm@11
          npm --version

      # Fail on the first line rather than on the first package: npm would
      # otherwise report a bare ENEEDAUTH, which reads like a registry fault.
      - name: Require the npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::The NPM_TOKEN secret is not set. npm deprecate cannot use trusted publishing; run it from a maintainer's machine (docs/contributing.md, Publishing)."
            exit 1
          fi

      - name: Deprecate every public package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RANGE: ${{ inputs.range }}
          MESSAGE: ${{ inputs.message }}
        run: |
          set -eu
          for manifest in packages/*/package.json; do
            name=$(node -p "const m=require('./$manifest'); m.private ? '' : m.name")
            [ -z "$name" ] && continue
            echo "deprecating $name@\"$RANGE\""
            npm deprecate "$name@$RANGE" "$MESSAGE"
          done
