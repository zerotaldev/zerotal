name: Release

# Publishing was the one process the repo had no automation for: 23 lockstep
# packages published by hand is unrepeatable and unauditable. This workflow makes
# a release a verifiable artifact trail — push a `v*` tag and it re-runs the
# quality gates, publishes every public package to npm with provenance (so
# consumers can verify each tarball came from this repository's CI), and creates
# a GitHub Release pointing at the changelog.
#
# npm authenticates each package with trusted publishing: it trades this
# workflow's OIDC identity for a short-lived token scoped to that one package,
# so nothing long-lived has to be stored or renewed. A package that is not yet
# linked to this workflow on npmjs.com falls back to the `NPM_TOKEN` repository
# secret (an npm automation token with publish rights to the @zerotal scope,
# create-zerotal and zerotal), and the publish log names which path each
# package took. Publishing stops needing the secret once a release reports
# every package on trusted publishing (deprecate.yml still uses it); the steps
# are in docs/contributing.md under "Publishing".

on:
  push:
    tags: ["v*"]

# Read-only by default; the two jobs that need more ask for it themselves. The OIDC
# token used to be granted here, to every job, so the gates — which install and run
# the whole dependency tree — held a token npm would exchange for publish rights.
# `workflows:check` fails if `id-token: write` appears anywhere but `publish`.
permissions:
  contents: read

env:
  APP_KEY: ci-app-key-aaaaaaaaaaaaaaaaaaaaaaaaaaaa
  APP_ENV: test

jobs:
  # A tag is only a release if the tree still passes everything CI enforces.
  verify:
    name: Gates
    runs-on: ubuntu-latest
    # Caps, not budgets: Gates runs ~5 min, Publish ~2, the Release ~1. A hung Gates fails the
    # release before anything is published. Publish is capped far above its normal run on
    # purpose: cancelling it midway would leave some packages on npm and not others.
    timeout-minutes: 45
    steps:
      # Full history and tags, because the release-notes and breaking-change gates diff
      # against the previous release. The default checkout fetches one commit and only
      # the tag being released, so both compared the release with itself: the
      # breaking-change gate from 1.11.2 and the release-notes gate from 1.14.1 passed
      # every release having checked nothing.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # Before Install, which would otherwise fail on a lockfile a newer Bun wrote with an
      # error that does not say so. See the same step in ci.yml.
      - name: Lockfile format
        run: bun run lockfile:check

      - name: Install
        run: bun install --frozen-lockfile

      # Packages only, not `apps/*`. The gate exists to decide whether the tree is
      # fit to publish, and the apps are not published — `apps/docs` is a website.
      # It also cannot pass here: its tests read an app `.env` that is deliberately
      # gitignored, and its browser tests drive a seeded dev database that no runner
      # has. Letting it decide a release meant a tag could never ship, which is a
      # gate answering a question nobody asked it.
      #
      # CI (ci.yml) still runs the whole workspace, so the app keeps failing
      # loudly where that is the right signal.
      - name: Typecheck
        run: bun run typecheck:packages

      - name: Test
        run: bun run test:packages

      # The same checks `ci.yml` runs on a pull request, because a publish is
      # permanent and a pull request is not.
      #
      # This job used to be typecheck + test + the tag check, and nothing else. So
      # every convention, surface and documentation gate guarded the PR path and not
      # the publish path — the weaker check on the more expensive action. 1.11.0 and
      # 1.11.1 both went to npm over a CI that had been red since the first of them,
      # and nothing in the release objected, because nothing in the release looked.
      #
      # Kept as separate steps rather than one script so a failure names itself, and
      # `!cancelled()` so the first failure does not hide the rest.
      - name: Package conventions
        if: ${{ !cancelled() }}
        run: bun run lint:packages:ci

      - name: Lint
        if: ${{ !cancelled() }}
        run: bun run lint:ci

      - name: Formatting
        if: ${{ !cancelled() }}
        run: bun run format:check

      - name: Cast ratchet
        if: ${{ !cancelled() }}
        run: bun run cast:check

      - name: Internal prefix
        if: ${{ !cancelled() }}
        run: bun run internal:prefix:check

      - name: API surface
        if: ${{ !cancelled() }}
        run: bun run api:surface:check

      - name: Breaking changes are announced
        if: ${{ !cancelled() }}
        run: bun run breaking:check --tag "${GITHUB_REF_NAME}"

      - name: Documentation examples
        if: ${{ !cancelled() }}
        run: bun run docs:examples:check

      # Retiring a command means finding every page that teaches it, and "every
      # page" is not a thing anyone recalls. `serve --dev` was retired in 1.13.0
      # and stayed in twenty places for three weeks, including the getting-started
      # guide. Driven by the upgrade codemods, so what the docs teach cannot drift
      # from what the framework accepts.
      - name: Docs teach no retired command
        if: ${{ !cancelled() }}
        run: bun run retired:check

      # A link is checked against the page as the site renders it. On 29 Oct 2026
      # twenty-two links went nowhere: anchors guessed by hand (`#1-10-to-1-11` for a
      # heading that renders as `110-to-111`), and relative `.md` links that work on
      # GitHub and 404 on zerotal.dev.
      - name: Docs links arrive
        if: ${{ !cancelled() }}
        run: bun run docs:links

      - name: Docs coverage
        if: ${{ !cancelled() }}
        run: bun run docs:coverage

      - name: Dependency policy
        if: ${{ !cancelled() }}
        run: bun run deps:check

      - name: Script tests
        if: ${{ !cancelled() }}
        run: bun run test:scripts

      - name: Vendored docs corpus
        if: ${{ !cancelled() }}
        run: bun run arch:docs:check

      - name: Optional-property widening
        if: ${{ !cancelled() }}
        run: bun run exact:optional:check

      - name: Workflow supply-chain rules
        if: ${{ !cancelled() }}
        run: bun run workflows:check

      - name: Typecheck tests
        if: ${{ !cancelled() }}
        run: bun run typecheck:tests

      # Every package whose source changed since the last tag has to say so.
      #
      # 1.13.4 shipped a user-facing change to @zerotal/inertia whose release
      # notes did not mention Inertia at all, because notes get written from what
      # the author meant to ship rather than from the diff — and anything that
      # landed on main in between goes out silently. The author is the last person
      # who can catch that, since they are recalling rather than reading.
      - name: Release notes cover what changed
        if: ${{ !cancelled() }}
        run: bun run scripts/release-notes-check.ts --tag "${GITHUB_REF_NAME}"

      - name: Tag matches package version
        if: ${{ !cancelled() }}
        run: bun run scripts/publish-packages.ts --dry-run --tag "${GITHUB_REF_NAME}"

      # The tarballs the step above just packed, installed into every starter and
      # run through its own checks. A starter that does not work from what would
      # be published stops the release here, before any package reaches npm.
      - name: Starters work from the packed release
        if: ${{ !cancelled() }}
        run: bun run starters:smoke

  publish:
    name: Publish to npm with provenance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    permissions:
      contents: read
      # The workflow's OIDC identity: trusted publishing exchanges it for a
      # publish token, and provenance attestation is signed against it.
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      # npm does the publishing: `npm publish --provenance` is the attestation
      # path. Bun does the packing, because `bun pm pack` rewrites workspace:*
      # dependencies to real versions.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later, and Node 22 bundles npm 10,
      # which would publish every package with the token and never try OIDC.
      # Pinned to a major, so a new npm major changes how releases publish only
      # through a commit here.
      - name: Upgrade npm
        run: |
          npm install -g npm@11
          npm --version

      - name: Install
        run: bun install --frozen-lockfile

      # NODE_AUTH_TOKEN stays while any package is still unlinked: npm tries OIDC
      # first and uses the token only when the exchange fails. Once the secret is
      # deleted this expression is empty and npm relies on OIDC alone.
      - name: Publish
        run: bun run scripts/publish-packages.ts --tag "${GITHUB_REF_NAME}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: publish
    permissions:
      # gh release create.
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # A security fix on an older line is published under its own npm dist-tag, so
      # `latest` stays on the newest line (scripts/dist-tag.ts). The GitHub Release
      # follows npm: it is marked latest only when this version is npm's `latest`.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(npm view zerotal dist-tags.latest 2>/dev/null || true)"
          if [ -n "${latest}" ] && [ "${latest}" != "${GITHUB_REF_NAME#v}" ]; then
            mark_latest="--latest=false"
          else
            mark_latest="--latest"
          fi
          gh release create "${GITHUB_REF_NAME}" "${mark_latest}" \
            --title "Zerotal ${GITHUB_REF_NAME}" \
            --notes "Published to npm with provenance. Per-version changes and migration notes: [Release Notes](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/changelog.md); per-package detail lives in each package's CHANGELOG.md."
