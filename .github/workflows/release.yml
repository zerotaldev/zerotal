name: Release

# Publishing was the one process the repo had no automation for: 23 lockstep
# packages published by hand is unrepeatable and unauditable. This workflow makes
# a release a verifiable artifact trail — push a `v*` tag and it re-runs the
# quality gates, publishes every public package to npm with provenance (so
# consumers can verify each tarball came from this repository's CI), and creates
# a GitHub Release pointing at the changelog.
#
# Requires the `NPM_TOKEN` repository secret (an npm automation token with
# publish rights to the @zerotal scope and create-zerotal).

on:
  push:
    tags: ["v*"]

permissions:
  # Provenance attestation is signed against the workflow's OIDC identity.
  id-token: write
  # gh release create.
  contents: write

env:
  APP_KEY: ci-app-key-aaaaaaaaaaaaaaaaaaaaaaaaaaaa
  APP_ENV: test

jobs:
  # A tag is only a release if the tree still passes everything CI enforces.
  verify:
    name: Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      # Packages only, not `apps/*`. The gate exists to decide whether the tree is
      # fit to publish, and the apps are not published — `apps/docs` is a website.
      # It also cannot pass here: its tests read an app `.env` that is deliberately
      # gitignored, and its browser tests drive a seeded dev database that no runner
      # has. Letting it decide a release meant a tag could never ship, which is a
      # gate answering a question nobody asked it.
      #
      # CI (ci.yml) still runs the whole workspace, so the app keeps failing
      # loudly where that is the right signal.
      - name: Typecheck
        run: bun run typecheck:packages

      - name: Test
        run: bun run test:packages

      # The same checks `ci.yml` runs on a pull request, because a publish is
      # permanent and a pull request is not.
      #
      # This job used to be typecheck + test + the tag check, and nothing else. So
      # every convention, surface and documentation gate guarded the PR path and not
      # the publish path — the weaker check on the more expensive action. 1.11.0 and
      # 1.11.1 both went to npm over a CI that had been red since the first of them,
      # and nothing in the release objected, because nothing in the release looked.
      #
      # Kept as separate steps rather than one script so a failure names itself, and
      # `!cancelled()` so the first failure does not hide the rest.
      - name: Package conventions
        if: ${{ !cancelled() }}
        run: bun run lint:packages:ci

      - name: Lint
        if: ${{ !cancelled() }}
        run: bun run lint:ci

      - name: Formatting
        if: ${{ !cancelled() }}
        run: bun run format:check

      - name: Cast ratchet
        if: ${{ !cancelled() }}
        run: bun run cast:check

      - name: Internal prefix
        if: ${{ !cancelled() }}
        run: bun run internal:prefix:check

      - name: API surface
        if: ${{ !cancelled() }}
        run: bun run api:surface:check

      - name: Breaking changes are announced
        if: ${{ !cancelled() }}
        run: bun run breaking:check

      - name: Documentation examples
        if: ${{ !cancelled() }}
        run: bun run docs:examples:check

      - name: Docs coverage
        if: ${{ !cancelled() }}
        run: bun run docs:coverage

      - name: Vendored docs corpus
        if: ${{ !cancelled() }}
        run: bun run arch:docs:check

      - name: Optional-property widening
        if: ${{ !cancelled() }}
        run: bun run exact:optional:check

      - name: Typecheck tests
        if: ${{ !cancelled() }}
        run: bun run typecheck:tests

      # Every package whose source changed since the last tag has to say so.
      #
      # 1.13.4 shipped a user-facing change to @zerotal/inertia whose release
      # notes did not mention Inertia at all, because notes get written from what
      # the author meant to ship rather than from the diff — and anything that
      # landed on main in between goes out silently. The author is the last person
      # who can catch that, since they are recalling rather than reading.
      - name: Release notes cover what changed
        if: ${{ !cancelled() }}
        run: bun run scripts/release-notes-check.ts --tag "${GITHUB_REF_NAME}"

      - name: Tag matches package version
        if: ${{ !cancelled() }}
        run: bun run scripts/publish-packages.ts --dry-run --tag "${GITHUB_REF_NAME}"

  publish:
    name: Publish to npm with provenance
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # npm does the publishing: `npm publish --provenance` is the attestation
      # path. Bun does the packing, because `bun pm pack` rewrites workspace:*
      # dependencies to real versions.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install
        run: bun install --frozen-lockfile

      - name: Publish
        run: bun run scripts/publish-packages.ts --tag "${GITHUB_REF_NAME}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@v5

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Zerotal ${GITHUB_REF_NAME}" \
            --notes "Published to npm with provenance. Per-version changes and migration notes: [Release Notes](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/changelog.md); per-package detail lives in each package's CHANGELOG.md."
