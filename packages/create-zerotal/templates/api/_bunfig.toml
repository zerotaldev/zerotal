# Bun installs a package's peer dependencies unless told not to. Every starter turns that off:
# everything this app uses is listed in package.json, and every peer a Zerotal package declares is
# optional, so nothing is lost, and a peer of some later dependency cannot slip in unlisted.
[install]
peer = false

# No bare-`bun test` guard here, unlike the other starters. Every test in this app boots through
# tests/helpers.ts, which pins an in-memory database whatever .env says, so a bare `bun test` (or an
# editor's test runner) is already safe, and .env sets DATABASE_URL from the first run — the guard
# would refuse exactly the runs it exists to allow. A test that boots the app another way should use
# `bun zt test`, which gives the suite its own database.
